id: session-start-hook
title: 세션 시작 훅으로 매번 설명하던 걸 자동 주입하기
category: automation
level: intermediate
summary: |
  "지금 브랜치는 X고, 최근에 Y를 바꿨어" 같은 설명을 세션마다 반복하고 있다면
  SessionStart 훅으로 자동화할 수 있다. 세션이 열릴 때 명령을 돌려
  그 결과를 컨텍스트에 넣어준다.
why: |
  매 세션 같은 정보를 손으로 넣는 것은 잊기도 쉽고 귀찮다.
  훅은 빠뜨리지 않는다.
how:
  - 세션마다 반복해서 알려주는 정보를 찾는다 — 브랜치, 최근 커밋, 실행 중인 서비스 등.
  - SessionStart 훅에 그 정보를 출력하는 명령을 등록한다.
  - 출력은 짧게 유지한다 — 모든 세션의 컨텍스트에 들어가는 비용이다.
  - 자주 바뀌지 않는 정보라면 훅 대신 CLAUDE.md가 더 적합하다.
recipe: session-start-hook
verify: |
  새 세션을 열고 "지금 어떤 브랜치야?"처럼 물어본다.
  도구를 쓰지 않고 바로 답하면 훅으로 주입된 것이다.
sources:
  - https://code.claude.com/docs/en/hooks
  - https://code.claude.com/docs/en/hooks-guide
tags:
  - hooks
  - session
  - context
added: '2026-07-30'
