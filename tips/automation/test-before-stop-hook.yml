id: test-before-stop-hook
title: 작업을 끝내기 전에 테스트를 자동으로 돌리게 하기
category: automation
level: intermediate
summary: |
  "다 됐습니다"라고 했는데 테스트가 깨져 있는 경우가 있다.
  Stop 훅에서 테스트를 돌리면 세션이 끝나기 전에 결과가 나오고,
  실패하면 그 자리에서 이어서 고칠 수 있다.
why: |
  실패를 나중에 CI에서 발견하면 컨텍스트가 이미 날아간 뒤다.
  같은 세션에서 잡으면 방금 무엇을 바꿨는지 그대로 알고 있다.
how:
  - 설치 명령으로 Stop 훅을 넣는다. 기본은 `npm test`다.
  - 프로젝트에 맞게 명령을 바꾼다 — pytest, go test, cargo test 등.
  - 테스트가 느리면 전체 대신 변경 범위만 돌리는 명령으로 바꾼다.
  - 훅이 매번 도는 게 부담이면 특정 디렉터리 작업에서만 걸리도록 프로젝트 설정에 넣는다.
recipe: test-on-stop-hook
verify: |
  일부러 테스트를 깨뜨린 뒤 작업을 마무리시켜 본다. 훅이 실패를 잡아내면 동작한 것이다.
sources:
  - https://code.claude.com/docs/en/hooks
  - https://code.claude.com/docs/en/hooks-guide
tags:
  - hooks
  - testing
  - verification
added: '2026-07-30'
