id: headless-scripting
title: claude -p로 파이프라인에 끼워 넣기
category: automation
level: intermediate
summary: |
  Claude Code는 대화형으로만 쓰는 도구가 아니다. `claude -p "..."`는 프롬프트를
  받아 결과만 출력하므로 셸 파이프라인의 한 단계로 쓸 수 있다.
  로그를 넣어 이상 징후를 찾거나, 변경 파일 목록을 넣어 검토시킬 수 있다.
why: |
  기존 스크립트에 판단이 필요한 단계를 끼워 넣을 수 있게 된다.
  정규식으로는 못 하던 것들이 한 줄로 해결되는 경우가 있다.
how:
  - '`tail -200 app.log | claude -p "이상 징후가 있으면 요약해줘"`처럼 파이프로 넣는다.'
  - '`git diff main --name-only | claude -p "이 파일들 보안 관점에서 검토해줘"`처럼 조합한다.'
  - 출력 형식을 명시하면 뒤 단계에서 파싱하기 쉽다.
  - CI에 넣을 때는 권한 설정을 명시적으로 좁힌다 — 무인 실행이므로 승인할 사람이 없다.
verify: |
  파이프라인을 한 번 돌려 출력이 기대한 형식으로 나오는지, 종료 코드가 정상인지 확인한다.
sources:
  - https://code.claude.com/docs/en/headless
  - https://code.claude.com/docs/en/cli-reference
tags:
  - cli
  - headless
  - scripting
added: '2026-07-30'
