id: scheduled-routines
title: 정기적으로 반복되는 일은 스케줄에 맡기기
category: automation
level: intermediate
summary: |
  아침마다 PR 훑기, 주간 의존성 점검, CI 실패 분석 같은 일은 매번 사람이
  시작할 필요가 없다. 루틴은 Anthropic 인프라에서 돌아 컴퓨터가 꺼져 있어도
  실행되고, 데스크톱 예약 작업은 로컬 파일에 접근할 수 있다.
why: |
  "생각날 때 하는 점검"은 대개 안 하게 된다. 스케줄에 올리면 빠지지 않는다.
how:
  - 반복 주기가 정해진 작업을 하나 고른다 — 매일 아침, 매주 월요일 등.
  - 로컬 파일·도구가 필요하면 데스크톱 예약 작업, 아니면 루틴을 쓴다.
  - CLI에서는 `/schedule`로 만들 수 있다.
  - 결과를 어디로 받을지 정한다 — 알림, 슬랙, PR 등.
verify: |
  주기를 짧게 잡아 한 번 실행되는 것을 확인한 뒤 원래 주기로 되돌린다.
sources:
  - https://code.claude.com/docs/en/routines
  - https://code.claude.com/docs/en/desktop-scheduled-tasks
tags:
  - scheduling
  - routines
  - automation
added: '2026-07-30'
