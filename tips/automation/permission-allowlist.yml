id: permission-allowlist
title: 안전한 명령을 미리 허용해 승인 프롬프트 줄이기
category: automation
level: beginner
summary: |
  `npm test`나 `git status` 같은 읽기 전용·무해한 명령까지 매번 승인하다 보면
  승인이 습관이 되어 정작 위험한 명령도 그냥 통과시키게 된다.
  안전한 것들을 미리 허용 목록에 넣으면 남은 프롬프트가 진짜 봐야 할 것만 남는다.
why: |
  승인 피로는 보안 문제다. 프롬프트가 줄어야 남은 프롬프트를 실제로 읽는다.
how:
  - '`/permissions`로 현재 설정을 확인한다.'
  - 자주 승인하게 되는 무해한 명령을 allow에 추가한다 — 테스트, 린트, git 조회 등.
  - 되돌리기 어려운 것은 넣지 않는다 — `git push`, 배포, 삭제, 마이그레이션.
  - 확실히 막고 싶은 것은 deny에 명시한다. deny가 allow보다 우선한다.
recipe: permission-allowlist
verify: |
  허용한 명령을 실행시켜 보면 프롬프트 없이 바로 돌아가고,
  목록에 없는 명령은 여전히 승인을 묻는다.
sources:
  - https://code.claude.com/docs/en/permissions
  - https://code.claude.com/docs/en/settings
tags:
  - permissions
  - settings
  - security
added: '2026-07-30'
