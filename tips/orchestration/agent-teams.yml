id: agent-teams
title: 독립적인 작업은 에이전트 팀으로 병렬 처리하기
category: orchestration
level: advanced
summary: |
  서로 의존하지 않는 작업이 여러 개일 때는 순서대로 처리할 이유가 없다.
  에이전트 팀은 리드 에이전트가 작업을 쪼개 여러 서브에이전트에 나눠주고
  결과를 합친다. 벽시계 시간이 작업 수만큼이 아니라 가장 느린 하나만큼 걸린다.
why: |
  "5개 모듈에 같은 마이그레이션 적용" 같은 팬아웃 작업을 직렬로 돌리면
  대기 시간이 그대로 쌓인다. 서로 독립적이라면 나눌 수 있다.
how:
  - 작업이 정말 독립적인지 먼저 확인한다. 같은 파일을 건드리면 병렬화하지 않는다.
  - '"이 5개 패키지에 대해 각각 에이전트를 띄워 병렬로 처리해줘"처럼 팬아웃을 명시한다.'
  - 각 에이전트에 필요한 컨텍스트를 처음부터 충분히 준다 — 다시 브리핑하면 이득이 사라진다.
  - 결과가 모이면 통합·검증은 메인 세션에서 한 번에 한다.
verify: |
  실행 중 여러 에이전트가 동시에 도는 게 보인다. 작업이 하나씩 순차로 끝난다면
  팬아웃이 안 된 것이므로 요청을 더 명시적으로 다시 쓴다.
sources:
  - https://code.claude.com/docs/en/agent-teams
  - https://code.claude.com/docs/en/sub-agents
