id: agent-view-monitor
title: 여러 세션을 한 화면에서 지켜보기
category: orchestration
level: intermediate
summary: |
  병렬로 여러 작업을 돌리기 시작하면 어느 세션이 멈춰 있고 어느 세션이 승인을
  기다리는지 놓치게 된다. 에이전트 뷰는 실행 중인 세션들을 한 화면에 모아
  상태를 보여준다.
why: |
  병렬화의 이득은 방치된 세션이 생기는 순간 사라진다. 승인 대기 중인 세션을
  10분 늦게 발견하면 그만큼 그냥 손해다.
how:
  - 여러 작업을 병렬로 띄운 뒤 에이전트 뷰를 연다.
  - 승인 대기·완료·오류 상태를 훑고 막힌 것부터 처리한다.
  - 세션 수를 감당할 수 있는 만큼만 띄운다 — 다 지켜볼 수 없으면 병렬화가 과한 것이다.
verify: |
  실행 중인 세션이 목록에 모두 나타나고 상태가 실시간으로 갱신되는지 확인한다.
sources:
  - https://code.claude.com/docs/en/agent-view
tags:
  - monitoring
  - parallelism
  - sessions
added: '2026-07-30'
