id: worktree-parallel
title: git worktree로 브랜치별 세션을 동시에 굴리기
category: orchestration
level: intermediate
summary: |
  한 리포에서 브랜치를 왔다갔다 하면 세션 컨텍스트가 꼬이고 빌드 캐시도 날아간다.
  git worktree는 같은 리포를 여러 디렉터리에 동시에 체크아웃한다.
  디렉터리마다 Claude 세션을 따로 띄우면 서로 간섭 없이 병렬로 일할 수 있다.
why: |
  리뷰 코멘트 반영과 새 기능 개발을 오가야 할 때, 브랜치 전환 대신 창을 바꾸면 된다.
  각 세션은 자기 작업 컨텍스트를 그대로 유지한다.
how:
  - '`git worktree add ../myrepo-featureA featureA`로 새 작업 트리를 만든다.'
  - 그 디렉터리에서 별도 Claude 세션을 연다.
  - 작업이 끝나면 `git worktree remove ../myrepo-featureA`로 정리한다.
  - node_modules 같은 의존성은 트리마다 따로 설치해야 한다는 점을 감안한다.
verify: |
  `git worktree list`에 트리가 나열되고, 각 디렉터리에서 `git branch --show-current`가
  서로 다른 브랜치를 가리키면 정상이다.
sources:
  - https://code.claude.com/docs/en/worktrees
tags:
  - git
  - parallelism
  - worktree
added: '2026-07-30'
