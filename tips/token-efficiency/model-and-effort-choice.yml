id: model-and-effort-choice
title: 작업 난이도에 모델과 사고 수준을 맞추기
category: token-efficiency
level: intermediate
summary: |
  모든 작업에 최고 설정을 쓸 이유는 없다. 오타 수정과 아키텍처 리팩터링에
  같은 자원을 쓰는 건 낭비다. 반대로 어려운 작업에 낮은 설정을 쓰면
  얕은 답이 나와 재시도 비용이 더 든다.
why: |
  비용과 지연은 설정을 낮추면 줄지만, 지능도 같이 준다.
  중요한 건 "항상 낮추기"가 아니라 작업마다 맞추는 것이다.
how:
  - '`/model`로 현재 모델을 확인하고 필요에 따라 바꾼다.'
  - 코딩·에이전트 작업은 사고 수준을 높게 유지한다. 여기서 아끼면 대개 손해다.
  - 단순 조회·포맷팅·분류 같은 작업은 낮춰도 품질 차이가 거의 없다.
  - 속도가 중요하고 예산이 허용되면 `/fast`를 검토한다 — 같은 모델을 더 빠르게 돌린다.
  - 세션 중간에 모델을 바꾸면 프롬프트 캐시가 무효화된다는 점을 감안한다.
verify: |
  설정을 바꾼 뒤 `/cost`로 실제 비용 변화를 확인하고, 결과 품질이 유지되는지
  같은 유형의 작업 두어 개로 비교한다.
sources:
  - https://code.claude.com/docs/en/model-config
  - https://code.claude.com/docs/en/fast-mode
tags:
  - model
  - cost
  - effort
added: '2026-07-30'
