id: cost-tracking
title: /cost로 이번 세션이 얼마 썼는지 보기
category: token-efficiency
level: beginner
summary: |
  토큰 효율화를 이야기하려면 먼저 숫자가 있어야 한다.
  `/cost`는 현재 세션의 사용량과 비용을 보여준다. 어떤 작업 방식이 비싼지
  감이 아니라 데이터로 알게 된다.
why: |
  "이 방식이 더 효율적일 것 같다"는 대부분 틀린다. 실측하면 의외의 곳에서
  비용이 나오는 경우가 많다 — 특히 큰 파일 반복 읽기와 긴 자동 압축.
how:
  - 작업을 하나 끝낸 뒤 `/cost`를 실행해 기준선을 만든다.
  - 같은 유형의 작업을 다른 방식으로 해보고 다시 측정해 비교한다.
  - 캐시 읽기 비율을 함께 본다 — 낮으면 프리픽스가 불안정하다는 신호다.
  - 팀 단위 사용량이 궁금하면 관리자에게 사용량 모니터링을 요청한다.
verify: |
  두 방식의 `/cost` 결과를 나란히 비교해 실제 차이를 확인한다.
sources:
  - https://code.claude.com/docs/en/costs
  - https://code.claude.com/docs/en/monitoring-usage
tags:
  - cost
  - measurement
added: '2026-07-30'
