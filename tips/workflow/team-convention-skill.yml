id: team-convention-skill
title: 팀 관례를 스킬로 만들어 공유하기
category: workflow
level: intermediate
summary: |
  "우리 팀은 API 에러를 이렇게 처리한다" 같은 관례를 각자 프롬프트로 설명하면
  사람마다 결과가 달라진다. 스킬로 만들어 리포에 커밋하면 팀 전체가
  같은 절차를 따르고, 관련된 작업에서만 로드되므로 비용도 없다.
why: |
  관례는 문서로 있어도 잘 안 읽힌다. 스킬은 필요한 시점에 자동으로 적용된다.
how:
  - 리뷰에서 반복적으로 지적되는 항목을 찾는다 — 그게 스킬로 만들 후보다.
  - '`.claude/skills/<이름>/SKILL.md`에 절차와 예시를 쓴다.'
  - description에 "언제 쓰는지"를 정확히 적는다 — 이게 로드 여부를 결정한다.
  - 리포에 커밋해 팀이 공유한다. 관례가 바뀌면 스킬을 고친다.
recipe: team-convention-skill
verify: |
  해당 유형의 작업을 시켜보고 스킬의 절차가 자동으로 적용되는지 확인한다.
sources:
  - https://code.claude.com/docs/en/skills
tags:
  - skills
  - team
  - conventions
added: '2026-07-30'
