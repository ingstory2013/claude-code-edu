id: resume-sessions
title: 어제 하던 작업을 컨텍스트 그대로 이어받기
category: workflow
level: beginner
summary: |
  세션을 닫았다고 맥락이 사라지는 건 아니다. 이전 세션을 재개하면
  그때까지의 대화와 파악한 내용을 그대로 이어받는다.
  "어제 뭐 하고 있었지"를 다시 설명할 필요가 없다.
why: |
  중단된 작업을 처음부터 다시 설명하는 것은 시간도 토큰도 낭비다.
  특히 며칠에 걸친 작업에서 차이가 크다.
how:
  - '`claude --continue`로 가장 최근 세션을 바로 이어받는다.'
  - '`claude --resume`으로 목록에서 골라 재개한다.'
  - 이어받은 뒤 "지금까지 상황 요약해줘"로 맥락을 되짚으면 좋다.
  - 완전히 다른 작업으로 넘어갈 때는 재개하지 말고 새 세션을 연다.
verify: |
  재개한 세션에서 이전 대화의 내용을 물어보면 다시 탐색하지 않고 답한다.
sources:
  - https://code.claude.com/docs/en/sessions
  - https://code.claude.com/docs/en/cli-reference
tags:
  - sessions
  - resume
  - continuity
added: '2026-07-30'
