id: remote-control-handoff
title: 자리를 비워도 작업이 멈추지 않게 하기
category: workflow
level: intermediate
summary: |
  긴 작업을 돌려놓고 퇴근하면 승인 프롬프트에서 멈춘 채 밤을 새운다.
  원격 제어를 켜두면 휴대폰이나 브라우저에서 이어받아 승인하고 방향을 잡아줄 수 있다.
why: |
  자율 작업의 이득은 사람이 병목이 되는 순간 사라진다.
  승인 하나 때문에 8시간을 놀리는 것은 아깝다.
how:
  - 긴 작업을 시작하기 전에 원격 제어를 활성화한다.
  - 자리를 비운 동안 알림이 오면 휴대폰에서 확인하고 승인·지시한다.
  - 애초에 승인이 덜 필요하도록 안전한 명령은 허용 목록에 미리 넣어둔다.
  - 아예 클라우드에서 돌리고 싶다면 웹 세션으로 시작하는 방법도 있다.
verify: |
  작업을 하나 띄운 뒤 다른 기기에서 접속해 같은 세션이 보이고 조작되는지 확인한다.
sources:
  - https://code.claude.com/docs/en/remote-control
  - https://code.claude.com/docs/en/claude-code-on-the-web
tags:
  - remote
  - mobile
  - long-running
added: '2026-07-30'
