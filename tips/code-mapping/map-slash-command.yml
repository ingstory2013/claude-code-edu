id: map-slash-command
title: /map 커맨드로 아키텍처 요약을 반복 생성하기
category: code-mapping
level: intermediate
summary: |
  새 리포나 낯선 모듈을 만날 때마다 "구조 좀 정리해줘"를 매번 다르게 설명하게 된다.
  같은 요청을 슬래시 커맨드로 고정하면 매번 같은 형식의 지도를 얻고,
  그 결과를 문서로 남겨 다음부터는 생성조차 건너뛸 수 있다.
why: |
  구조 파악은 형식이 일정해야 쓸모가 있다. 매번 다른 형식으로 나오면
  비교도 재사용도 어렵다.
how:
  - '`.claude/commands/map.md`에 원하는 출력 형식을 명시한 프롬프트를 넣는다.'
  - 인자로 대상 경로를 받게 해 `/map src/payments`처럼 범위를 좁혀 쓴다.
  - 결과가 마음에 들면 해당 디렉터리의 CLAUDE.md나 문서로 저장한다.
  - 구조가 크게 바뀔 때만 다시 돌린다.
recipe: map-command
verify: |
  `/map`을 두 번 실행했을 때 같은 형식의 결과가 나오는지 확인한다.
sources:
  - https://code.claude.com/docs/en/commands
  - https://code.claude.com/docs/en/large-codebases
tags:
  - slash-commands
  - architecture
  - documentation
added: '2026-07-30'
