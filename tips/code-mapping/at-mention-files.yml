id: at-mention-files
title: '@로 파일을 직접 지목해 탐색 단계를 건너뛰기'
category: code-mapping
level: beginner
summary: |
  어떤 파일을 봐야 하는지 이미 안다면 설명할 필요가 없다.
  `@`로 경로를 직접 지목하면 Claude가 찾는 과정을 통째로 건너뛴다.
  파일명을 말로 설명하다 오해가 생기는 일도 없어진다.
why: |
  "그 인증 미들웨어 파일 있잖아"는 탐색을 유발하고 가끔 엉뚱한 파일을 집는다.
  `@src/middleware/auth.ts`는 그런 여지가 없다.
how:
  - 프롬프트에 `@`를 치면 경로 자동완성이 뜬다.
  - 여러 파일을 함께 지목할 수 있다 — 비교나 일관성 확인에 유용하다.
  - 디렉터리를 지목하면 그 안의 구조를 참조한다.
  - 어디 있는지 모를 때만 탐색을 시킨다. 알면 지목이 항상 빠르고 정확하다.
verify: |
  `@`로 지목한 뒤 응답을 보면 파일을 찾는 도구 호출 없이 바로 내용에 대해 답한다.
sources:
  - https://code.claude.com/docs/en/interactive-mode
  - https://code.claude.com/docs/en/quickstart
tags:
  - interactive
  - files
  - precision
added: '2026-07-30'
