id: auto-memory
title: 자동 메모리가 쌓는 것을 확인하고 다듬기
category: code-mapping
level: beginner
summary: |
  Claude는 작업하면서 알아낸 것들 — 빌드 명령, 자주 틀리는 부분, 디버깅 요령 —
  을 자동으로 메모리에 저장해 다음 세션에서 쓴다. 이게 무엇을 담고 있는지
  한 번 확인해두면 잘못 학습된 내용을 바로잡을 수 있다.
why: |
  자동 메모리는 손대지 않아도 쌓이지만, 한 번 잘못 저장된 사실(예: 폐기된 빌드 명령)은
  계속 재사용된다. 가끔 들여다보는 것만으로 충분하다.
how:
  - 저장된 메모리를 확인해 사실과 다른 항목이 있는지 본다.
  - 틀린 내용은 고쳐달라고 하거나 직접 수정한다.
  - 팀 전체가 알아야 할 내용이라면 자동 메모리 대신 CLAUDE.md에 명시적으로 적는다.
  - 프로젝트 관례가 바뀌었다면 그 사실을 알려 메모리를 갱신하게 한다.
verify: |
  새 세션에서 "이 프로젝트 테스트는 어떻게 돌려?"처럼 물어봤을 때
  현재 맞는 답이 나오면 메모리가 최신이다.
sources:
  - https://code.claude.com/docs/en/memory
tags:
  - memory
  - claude-md
  - maintenance
added: '2026-07-30'
