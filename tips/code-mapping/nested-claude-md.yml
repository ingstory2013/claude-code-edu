id: nested-claude-md
title: 디렉터리별 CLAUDE.md로 규칙을 필요한 곳에만 두기
category: code-mapping
level: intermediate
summary: |
  모노레포에서 프론트엔드 규칙과 백엔드 규칙을 루트 CLAUDE.md에 다 넣으면
  어느 쪽 작업을 하든 양쪽 규칙을 다 싣게 된다. 하위 디렉터리에 CLAUDE.md를 두면
  그 안에서 작업할 때만 읽힌다.
why: |
  규칙의 적용 범위와 로드 범위를 일치시키는 것이 핵심이다.
  루트에는 리포 전체에 참인 것만, 나머지는 해당 디렉터리에.
how:
  - 팀·기술스택이 갈리는 경계를 찾는다 (packages/web, packages/api, services/* 등).
  - 그 디렉터리에 CLAUDE.md를 만들고 거기서만 통하는 규칙을 옮긴다.
  - 루트에는 "어느 디렉터리가 무엇을 담당하는지"만 남긴다.
  - 같은 규칙이 두 곳에 중복되면 루트로 올린다.
verify: |
  하위 디렉터리에서 작업을 시작하고 `/context`를 보면 해당 CLAUDE.md가 로드돼 있다.
  다른 디렉터리에서 작업할 때는 로드되지 않는다.
sources:
  - https://code.claude.com/docs/en/memory
tags:
  - claude-md
  - monorepo
  - scoping
added: '2026-07-30'
