id: claude-md-architecture-map
title: CLAUDE.md에 아키텍처 지도를 넣어 탐색을 건너뛰게 하기
category: code-mapping
level: beginner
summary: |
  Claude는 세션마다 리포 구조를 처음부터 다시 파악한다. 루트 CLAUDE.md에
  "무엇이 어디에 있는지" 10~20줄짜리 지도를 넣어두면 그 탐색이 사라진다.
  파일을 열어보는 대신 지도를 보고 바로 목표 파일로 간다.
why: |
  같은 탐색을 매 세션 반복하는 것은 순수한 낭비다. 지도는 한 번 쓰면 팀 전체가
  모든 세션에서 재사용한다.
how:
  - 리포 루트에 CLAUDE.md를 만든다 (`/init`이 초안을 만들어준다).
  - 주요 디렉터리별로 "무엇을 담당하는지" 한 줄씩 적는다.
  - 진입점을 명시한다 — 서버가 뜨는 파일, 라우트 정의, 설정이 로드되는 위치.
  - 자주 틀리는 관례를 적는다 — 테스트 실행 명령, 빌드 명령, 절대 건드리면 안 되는 생성 파일.
  - 파일 목록을 전부 나열하지 않는다. 지도는 목차가 아니라 이정표다.
verify: |
  새 세션을 열고 "결제 로직 어디 있어?"처럼 물어본다. 파일을 뒤지지 않고 바로
  올바른 경로를 답하면 지도가 작동한 것이다.
sources:
  - https://code.claude.com/docs/en/memory
tags:
