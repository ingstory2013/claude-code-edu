id: large-codebase-strategy
title: 대규모 코드베이스는 "전부 이해"가 아니라 "관련 부분만"으로 접근하기
category: code-mapping
level: intermediate
summary: |
  수십만 줄짜리 리포에서 "이 코드베이스 파악해줘"는 실패하는 요청이다.
  컨텍스트에 다 들어가지 않는다. 대신 작업에 필요한 조각만 정확히 찾아
  들어가는 방식으로 접근해야 한다.
why: |
  큰 리포에서 막히는 이유는 대개 모델의 한계가 아니라 요청의 범위가
  잘못 잡혔기 때문이다.
how:
  - 질문을 구체적으로 바꾼다 — "결제 흐름 파악해줘" 대신 "환불 요청이 들어오면 어떤 함수들이 순서대로 호출돼?"
  - 진입점을 알려준다. 시작점 하나만 줘도 탐색 범위가 극적으로 줄어든다.
  - 넓은 탐색이 필요하면 서브에이전트에 맡겨 요약만 받는다.
  - 자주 묻는 구조는 답을 CLAUDE.md나 문서로 굳혀 다음부터 탐색을 건너뛴다.
verify: |
  같은 질문을 구체화 전후로 던져보고, 읽은 파일 수와 답의 정확도를 비교한다.
sources:
  - https://code.claude.com/docs/en/large-codebases
  - https://code.claude.com/docs/en/common-workflows
tags:
  - large-codebase
  - scoping
  - exploration
added: '2026-07-30'
