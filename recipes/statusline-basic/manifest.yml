id: statusline-basic
name: 상태줄 — 디렉터리·브랜치·모델 표시
files:
  - src: statusline.sh
    dest: .claude/statusline.sh
  - src: settings.fragment.json
    dest: .claude/settings.json
    merge: json
notes: |
  설치 후 실행 권한이 필요합니다: chmod +x ~/.claude/statusline.sh
  (--project로 설치했다면 ./.claude/statusline.sh)
  상태줄 스크립트는 매 프롬프트마다 실행되므로 빠르게 유지하세요.
